<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Query — AIRagService</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page-title="Query" data-page-subtitle="Ask questions against your indexed documents" class="bg-slate-50 text-slate-900 antialiased">

  <div id="app-layout" class="flex min-h-screen">
    <main id="main-content" class="flex min-h-screen flex-1 flex-col">
      <div class="flex-1 p-4 sm:p-6 lg:p-8">
        <div class="mx-auto max-w-4xl">

          <!-- Query input -->
          <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <form id="query-form">
              <label for="question-input" class="block text-sm font-medium text-slate-700">Your question</label>
              <textarea
                id="question-input"
                rows="4"
                placeholder="What would you like to know from your documents?"
                class="mt-2 w-full resize-none rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
              ></textarea>
              <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
                <span id="char-count" class="text-xs text-slate-400">0 / 2000</span>
                <div class="flex gap-2">
                  <button id="clear-btn" type="button" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">
                    Clear
                  </button>
                  <button id="copy-btn" type="button" class="hidden inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9.75a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 011.927-.184"/></svg>
                    Copy
                  </button>
                  <button id="ask-btn" type="submit" class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-500 disabled:opacity-60">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
                    Ask
                  </button>
                </div>
              </div>
              <p class="mt-2 text-xs text-slate-400">Press Ctrl+Enter to submit</p>
            </form>
          </div>

          <!-- Empty state -->
          <div id="query-empty" class="mt-8 text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-indigo-100">
              <svg class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
              </svg>
            </div>
            <h3 class="mt-4 text-sm font-medium text-slate-900">Ready to answer your questions</h3>
            <p class="mt-1 text-sm text-slate-500">Ask anything about your indexed PDF documents.</p>
          </div>

          <!-- Answer section -->
          <div id="answer-section" class="mt-8 hidden space-y-6">
            <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
              <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Answer</h2>
              <div id="answer-text" class="mt-4 whitespace-pre-wrap text-sm leading-relaxed text-slate-800"></div>
            </div>
            <div id="sources-container"></div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/query.js"></script>
</body>
</html>
