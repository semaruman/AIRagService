<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System — AIRagService</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page-title="System" data-page-subtitle="Health, configuration, and API settings" class="bg-slate-50 text-slate-900 antialiased">

  <div id="app-layout" class="flex min-h-screen">
    <main id="main-content" class="flex min-h-screen flex-1 flex-col">
      <div class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6">

        <!-- Health checks -->
        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-semibold text-slate-900">Health Status</h2>
            <button id="refresh-health" type="button" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-50">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
              Refresh
            </button>
          </div>
          <div class="mt-4 grid gap-4 sm:grid-cols-2">
            <div id="health-live" class="rounded-lg border border-slate-200 p-4">
              <div class="flex justify-center py-6"><div class="spinner"></div></div>
            </div>
            <div id="health-ready" class="rounded-lg border border-slate-200 p-4">
              <div class="flex justify-center py-6"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- Live stats -->
        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <h2 class="text-base font-semibold text-slate-900">Live Statistics</h2>
          <div id="system-stats" class="mt-4">
            <div class="flex justify-center py-6"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Configuration -->
        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <h2 class="text-base font-semibold text-slate-900">Configuration</h2>
          <p class="mt-1 text-sm text-slate-500">Service configuration from appsettings (read-only display).</p>
          <div id="config-grid" class="mt-4 grid gap-2 sm:grid-cols-2"></div>
        </div>

        <!-- API Key -->
        <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
          <h2 class="text-base font-semibold text-slate-900">API Key Authentication</h2>
          <p class="mt-1 text-sm text-slate-500">Store your API key locally when <code class="rounded bg-slate-100 px-1 py-0.5 text-xs">ApiKeyAuth:Enabled</code> is true.</p>
          <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-end">
            <div class="flex-1">
              <label for="api-key-input" class="block text-sm font-medium text-slate-700">X-API-Key</label>
              <input id="api-key-input" type="password" placeholder="Enter API key…" autocomplete="off" class="mt-1 w-full rounded-lg border border-slate-200 px-4 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
            </div>
            <div class="flex gap-2">
              <button id="save-api-key" type="button" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Save</button>
              <button id="clear-api-key" type="button" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Clear</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/system.js"></script>
</body>
</html>
